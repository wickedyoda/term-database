name: Validate Term Database

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JSON schema
        run: python3 scripts/validate.py

      - name: Check for duplicate IDs
        run: python3 scripts/validate.py --duplicates

      - name: Check related references
        run: python3 scripts/validate.py --references
